name: ECC2K-130 reference tests

on:
  pull_request:
    paths:
      - experiments/ecc2k130/**
      - .github/workflows/ecc2k130-tests.yml
  push:
    paths:
      - experiments/ecc2k130/**
      - .github/workflows/ecc2k130-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: experiments/ecc2k130
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_ecc2k test_tensor_contraction test_tensor_encoding
      - run: python tensor_cli.py recursive-check
      - run: python ecc2k.py demo --degree 13 --secret 1427 --slots 2 --backend tensor_indexed --seconds 60
